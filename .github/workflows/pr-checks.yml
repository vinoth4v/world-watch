name: PR checks

# Four gates, all blocking. Configure branch protection on `main` to require
# all four status checks (gitleaks, typecheck, build, preview-smoke) before a
# PR can be merged — this workflow produces the checks, but making them
# mandatory is a repository setting this file cannot set for itself.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN has no pull-requests scope. Without it,
    # gitleaks-action's own call to list the PR's commits 403s with
    # "Resource not accessible by integration" before it scans anything.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Exit 0 or the PR stays red. Models and agents do not get to
      # self-report success here — this is the check that decides.
      - run: pnpm -r build


  preview-smoke:
    name: preview-smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for the Coolify preview of this commit
        id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          APP_NAME: ${{ github.event.repository.name }}
        run: |
          url=$(node .github/scripts/wait-for-preview.mjs)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: Playwright smoke against the preview URL
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
        run: pnpm exec playwright test
